<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <!-- Cat & ball shadows -->
  <ellipse cx="45" cy="104.5" rx="23" ry="3.8" fill="#000000" fill-opacity="0.36"/>
  <ellipse cx="86" cy="104" rx="9" ry="2.4" fill="#000000" fill-opacity="0.3">
    <animate attributeName="cx" values="74;87;97;85;74" dur="1.65s" repeatCount="indefinite"/>
    <animate attributeName="rx" values="7;5;10;6;7" dur="1.65s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Loose yarn tail on floor -->
  <path d="M 94 102 Q 103 105 111 101" stroke="#C6E34A" stroke-opacity="0.7" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Wagging black tail on left -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="-10 31 94; 11 31 94; -10 31 94" dur="1.1s" repeatCount="indefinite"/>
    <path d="M 31 94 C 17 91 12 76 17 60 C 20 50 17 42 13 36"
      stroke="#F4F1EA" stroke-opacity="0.74" stroke-width="10.4" stroke-linecap="round"/>
    <path d="M 31 94 C 17 91 12 76 17 60 C 20 50 17 42 13 36"
      stroke="#18181C" stroke-width="7.8" stroke-linecap="round"/>
  </g>

  <!-- Playfully leaning tuxedo body -->
  <path d="M 31 64 C 23 72 22 88 28 98 C 33 102.5 60 102.5 65 98 C 69 90 68 73 61 64 Z"
    fill="#18181C" stroke="#F4F1EA" stroke-opacity="0.74" stroke-width="2" stroke-linejoin="round"/>
  <path d="M 46.5 80 C 49.5 83.5 51 87.5 46.5 93 C 42 87.5 43.5 83.5 46.5 80 Z" fill="#F6F4EE"/>
  <path d="M 31 65.5 C 29.5 70 31 74.5 34.5 76.5 L 36.5 74.5 C 38.5 78 42.5 80.8 47 81.5 C 51.5 80.8 55.5 78 57.5 74.5 L 59.5 76 C 62 73.5 62.5 69 60.5 65.5 Z"
    fill="#F6F4EE"/>

  <!-- Golden "福" charm tag -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="-8 41 68; 8 41 68; -8 41 68" dur="1.65s" repeatCount="indefinite"/>
    <circle cx="41" cy="68.2" r="1.3" fill="#A8383B"/>
    <rect x="37.8" y="68.6" width="6.6" height="6.4" rx="2.4" fill="#ECC04B" stroke="#9E711B" stroke-width="0.85"/>
    <path d="M 41.1 70.1 L 41.1 73.6 M 39.5 71.8 L 42.7 71.8" stroke="#7A500D" stroke-width="0.85" stroke-linecap="round"/>
  </g>

  <!-- Planted left leg & snowy white paw -->
  <path d="M 33 82 L 34.5 98.5 L 45 98.5 L 45.5 82 Z" fill="#18181C"/>
  <path d="M 33 98.5 C 32.5 94.5 46 94.5 46 99 C 46 103 33 103 33 98.5 Z" fill="#F6F4EE" stroke="#242429" stroke-width="1.2"/>

  <!-- Batting right arm & snowy white mitten -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="-28 57 74; 18 57 74; -8 57 74; -28 57 74" keyTimes="0;0.15;0.65;1" dur="1.65s" repeatCount="indefinite"/>
    <path d="M 57 74 Q 65 68 71 61" stroke="#F4F1EA" stroke-opacity="0.74" stroke-width="10.2" stroke-linecap="round"/>
    <path d="M 57 74 Q 65 68 71 61" stroke="#18181C" stroke-width="7.8" stroke-linecap="round"/>
    <ellipse cx="72.5" cy="59.5" rx="5.8" ry="4.6" transform="rotate(-25 72.5 59.5)"
      fill="#F6F4EE" stroke="#242429" stroke-width="1.2"/>
  </g>

  <!-- Tuxedo Head tracking the yarn ball -->
  <g transform="translate(-13 0)">
    <animateTransform attributeName="transform" type="rotate" additive="sum"
      values="-4 60 65; 6 60 65; -4 60 65" dur="1.65s" repeatCount="indefinite"/>
    <path d="M 60 27 Q 52.5 26.8 46.5 29.2 L 34 15.5 Q 30.5 13.5 30 18 L 31.5 39 C 25.5 45.5 25.2 56 32.5 62.5 C 39.5 68.5 49 70 60 70 C 71 70 80.5 68.5 87.5 62.5 C 94.8 56 94.5 45.5 88.5 39 L 90 17 Q 89.5 12.5 85.8 15 L 73 29.2 Q 67.5 26.8 60 27 Z"
      fill="#18181C" stroke="#F4F1EA" stroke-opacity="0.78" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 35 36.8 L 33.8 20 L 44.8 30.8 Z" fill="#62474A"/>
    <path d="M 85 36.8 L 86.2 19.5 L 75 30.8 Z" fill="#62474A"/>
    <path d="M 59.2 35 C 61.5 39.5 62.8 44.5 63.6 49.5 C 64.6 53.5 74 53.8 85.5 51.5 C 88 55 86.8 60.8 82 64.5 C 75.5 68.8 68 69.8 60 69.8 C 51 69.8 43.5 68.2 39.2 65.2 C 36.8 62.8 37.8 59.8 41 58.2 C 47.2 55.4 54.4 54 55.2 49.5 C 56 44.5 57.2 39.5 59.2 35 Z"
      fill="#F6F4EE"/>
    <path d="M 38.8 48.8 C 38.8 41.8 53.5 41.8 53.5 48.8 C 53.5 55.6 38.8 55.6 38.8 48.8 Z" fill="#C6CB67"/>
    <path d="M 65.5 48.8 C 65.5 41.8 80.2 41.8 80.2 48.8 C 80.2 55.6 65.5 55.6 65.5 48.8 Z" fill="#C6CB67"/>
    <ellipse cx="47.8" cy="48.5" rx="2.4" ry="4.8" fill="#121215"/>
    <ellipse cx="74.8" cy="48.5" rx="2.4" ry="4.8" fill="#121215"/>
    <circle cx="46.6" cy="46.4" r="1.4" fill="#FFFFFF"/>
    <circle cx="73.6" cy="46.4" r="1.4" fill="#FFFFFF"/>
    <path d="M 57.2 55.4 Q 59.8 54 62.4 55.4 L 59.8 58.5 Z" fill="#E59396"/>
    <path d="M 55.4 60.6 Q 57.8 62.8 59.8 59.5 Q 61.8 62.8 64.2 60.6" stroke="#26262C" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- Bouncing chartreuse yarn ball -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="74 64; 87 40; 97 95; 85 49; 74 64" keyTimes="0;0.24;0.52;0.78;1" dur="1.65s" repeatCount="indefinite"/>
    <circle cx="0" cy="0" r="8.6" fill="#C6E34A" stroke="#242429" stroke-width="1.5"/>
    <path d="M -6 -4 Q 0 -1 6 -4 M -7 1 Q 0 5 7 1 M -3 -7 Q 2 0 -2 7" stroke="#7A9418" stroke-width="1.3" stroke-linecap="round"/>
    <circle cx="-3" cy="-3" r="2" fill="#F7FFCC" fill-opacity="0.85"/>
  </g>
</svg>
